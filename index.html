<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldsun Auto – Factory Security Management</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Tahoma,sans-serif}
  :root{--primary:#1a4d8f;--accent:#ff6b00;--bg:#f4f6f9;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--success:#16a34a;--danger:#dc2626;--warn:#f59e0b}
  body{background:var(--bg);color:var(--text)}
  
  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a4d8f,#0f2f5c)}
  .login-box{background:#fff;padding:40px;border-radius:12px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .login-box h1{color:var(--primary);font-size:22px;margin-bottom:4px}
  .login-box p{color:var(--muted);font-size:13px;margin-bottom:24px}
  .login-box input,.login-box select{width:100%;padding:12px;margin-bottom:14px;border:1px solid var(--border);border-radius:8px;font-size:14px}
  .login-box button{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600}
  .login-box button:hover{background:#14396b}
  .login-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}
  
  #app{display:none}
  header{background:var(--primary);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
  header h1{font-size:18px;font-weight:600}
  header .user-info{font-size:13px;display:flex;align-items:center;gap:14px}
  header button{background:var(--accent);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px}
  .layout{display:flex;min-height:calc(100vh - 56px)}
  nav{width:220px;background:#fff;border-right:1px solid var(--border);padding:16px 0;flex-shrink:0}
  nav a{display:block;padding:12px 24px;color:var(--text);text-decoration:none;font-size:14px;border-left:3px solid transparent;cursor:pointer}
  nav a:hover{background:#f1f5f9}
  nav a.active{background:#eef4ff;border-left-color:var(--primary);color:var(--primary);font-weight:600}
  main{flex:1;padding:24px;overflow:auto}
  h2{font-size:20px;margin-bottom:20px;color:var(--primary)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
  .stat{background:var(--card);padding:18px;border-radius:10px;border-left:4px solid var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .stat .num{font-size:28px;font-weight:700;color:var(--primary)}
  .stat .label{font-size:12px;color:var(--muted);margin-top:4px}
  .stat.warn{border-left-color:var(--warn)} .stat.warn .num{color:var(--warn)}
  .stat.danger{border-left-color:var(--danger)} .stat.danger .num{color:var(--danger)}
  .stat.success{border-left-color:var(--success)} .stat.success .num{color:var(--success)}
  .card{background:var(--card);border-radius:10px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-bottom:20px}
  .card h3{font-size:15px;margin-bottom:14px;color:var(--primary);border-bottom:1px solid var(--border);padding-bottom:10px}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .form-grid label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
  .form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px}
  .form-grid textarea{resize:vertical;min-height:60px}
  .form-grid .full{grid-column:1/-1}
  .btn{padding:10px 20px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
  .btn-primary{background:var(--primary);color:#fff} .btn-primary:hover{background:#14396b}
  .btn-success{background:var(--success);color:#fff}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-warn{background:var(--warn);color:#fff}
  .btn-sm{padding:5px 10px;font-size:11px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:10px;text-align:left;border-bottom:1px solid var(--border)}
  th{background:#f8fafc;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .badge{padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600}
  .badge-pending{background:#fef3c7;color:#92400e}
  .badge-approved{background:#dcfce7;color:#166534}
  .badge-rejected{background:#fee2e2;color:#991b1b}
  .badge-in{background:#dbeafe;color:#1e40af}
  .badge-out{background:#f1f5f9;color:#475569}
  
  .hidden{display:none !important}
  
  .qr-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100}
  .qr-box{background:#fff;padding:30px;border-radius:12px;text-align:center;max-width:340px}
  .qr-box h3{margin-bottom:16px;color:var(--primary)}
  .qr-box #qrcode{margin:0 auto 16px;display:flex;justify-content:center}
  .qr-box p{font-size:13px;margin:4px 0;color:var(--text)}
  .filter-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
  .filter-bar input,.filter-bar select{padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:13px}
  
  #printSection { display: none; }
  
  @media print {
    body * { visibility: hidden; }
    #printSection, #printSection * { visibility: visible; }
    #printSection { position: absolute; left: 0; top: 0; width: 100%; display: block !important; padding: 20px;}
    
    .pass-container {
        border: 2px solid #000;
        padding: 30px;
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        font-family: 'Segoe UI', Tahoma, sans-serif;
        color: #000;
    }
    .pass-header {
        text-align: center;
        border-bottom: 2px dashed #000;
        padding-bottom: 15px;
        margin-bottom: 20px;
    }
    .pass-header h1 { font-size: 26px; margin: 0; font-weight: bold; }
    .pass-header p { font-size: 14px; margin: 5px 0 0 0; font-weight: bold; text-transform: uppercase;}
    
    .pass-details { width: 100%; margin-bottom: 30px; }
    .pass-details td { padding: 8px 5px; border-bottom: 1px dotted #999; font-size: 15px; }
    .pass-details td:first-child { font-weight: bold; width: 40%; }
    
    .pass-signatures { display: flex; justify-content: space-between; margin-top: 60px; }
    .signature-box { text-align: center; width: 45%; }
    .signature-line { border-top: 1px solid #000; margin-top: 50px; padding-top: 8px; font-weight: bold; font-size: 14px; }
    .pass-footer { text-align: center; font-size: 12px; margin-top: 40px; border-top: 1px solid #ccc; padding-top: 10px; }
    @page { margin: 15mm; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <h1>🛡️ Goldsun Auto</h1>
    <p>Factory Security Management System</p>
    <input id="loginUser" placeholder="Username" value="admin">
    <input id="loginPass" type="password" placeholder="Password" value="admin123">
    <select id="loginRole">
      <option value="Admin">Super Admin / IT</option>
      <option value="Guard">Security Guard</option>
      <option value="DeptHead">Department Head</option>
    </select>
    <button onclick="login()">Sign In</button>
    <div class="login-hint">Demo: Any username & password</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <h1>🛡️ Goldsun Auto – Security Management</h1>
    <div class="user-info">
      <span id="whoAmI"></span>
      <button onclick="logout()">Logout</button>
    </div>
  </header>
  <div class="layout">
    <nav id="nav"></nav>
    <main id="main"></main>
  </div>
</div>

<!-- QR MODAL -->
<div id="qrModal" class="qr-modal hidden">
  <div class="qr-box">
    <h3>Visitor Gate Pass</h3>
    <div id="qrcode"></div>
    <div id="qrDetails"></div>
    <button class="btn btn-primary" style="margin-top:16px" onclick="closeQR()">Close</button>
  </div>
</div>

<!-- PRINT SECTION -->
<div id="printSection"></div>

<script>
/* ============================================================
   DATA LAYER (SUPABASE CONNECTION)
   ============================================================ */
const SUPABASE_URL = 'https://itozsvgkzmtjflxqiozw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tKnYV0KH4Yw_SaVZyaAupw_UIe8bKo8';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DB = {
  async get(k) {
    try {
      const { data, error } = await supabaseClient.from(k).select('*').order('id', { ascending: false });
      if (error) { console.error(`Read error on ${k}:`, error.message); return []; }
      return data || [];
    } catch (err) {
      console.error(`Catch error on ${k}:`, err);
      return []; // Fallback to empty array so app doesn't crash
    }
  },
  async add(k, item) {
    const { id, ...newItem } = item;
    const { data, error } = await supabaseClient.from(k).insert([newItem]).select();
    if (error) { console.error('Insert error:', error); alert('Database Error: ' + error.message); return null; }
    return data ? data[0] : null;
  },
  async update(k, id, patch) {
    const { error } = await supabaseClient.from(k).update(patch).eq('id', id);
    if (error) console.error('Update error:', error);
  },
  async remove(k, id) {
    const { error } = await supabaseClient.from(k).delete().eq('id', id);
    if (error) console.error('Delete error:', error);
  }
};

const today = () => new Date().toISOString().slice(0,10);
const now = () => new Date().toLocaleString('en-IN');

/* ============================================================
   AUTH & PERMISSIONS
   ============================================================ */
let currentUser = null;

const ROLE_PERMISSIONS = {
  Admin: ['dashboard', 'visitors', 'employees', 'vehicles', 'materials', 'contractors', 'incidents', 'reports'],
  Guard: ['dashboard', 'visitors', 'employees', 'vehicles', 'materials'], 
  DeptHead: ['dashboard', 'visitors', 'reports']
};

async function login(){
  const u=document.getElementById('loginUser').value.trim();
  const r=document.getElementById('loginRole').value;
  if(!u){alert('Enter username');return;}
  
  currentUser={name:u,role:r};
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('whoAmI').textContent=`${u} (${r})`;
  
  buildNav(); 
  await navigate('dashboard'); 
}
function logout(){ location.reload(); }

/* ============================================================
   NAVIGATION
   ============================================================ */
const MENU=[
  {id:'dashboard',label:'📊 Dashboard'},
  {id:'visitors',label:'👤 Visitors'},
  {id:'employees',label:'🧑‍🏭 Employees'},
  {id:'vehicles',label:'🚚 Vehicles'},
  {id:'materials',label:'📦 Material Gate Pass'},
  {id:'contractors',label:'👷 Contractors'},
  {id:'incidents',label:'⚠️ Incidents'},
  {id:'reports',label:'📈 Reports'}
];

function buildNav(){
  const nav=document.getElementById('nav');
  const allowed = ROLE_PERMISSIONS[currentUser.role] || [];
  const visibleMenu = MENU.filter(m => allowed.includes(m.id));
  nav.innerHTML=visibleMenu.map(m=>`<a data-id="${m.id}" onclick="navigate('${m.id}')">${m.label}</a>`).join('');
}

async function navigate(id){
  const allowed = ROLE_PERMISSIONS[currentUser.role] || [];
  if(!allowed.includes(id)) {
    alert("You do not have permission to view this page.");
    return;
  }

  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  const main=document.getElementById('main');
  
  // Show loading text while fetching from database
  main.innerHTML = '<div class="empty">Loading data...</div>';

  if(id==='dashboard') main.innerHTML=await renderDashboard();
  else if(id==='visitors') main.innerHTML=await renderVisitors();
  else if(id==='employees') main.innerHTML=await renderEmployees();
  else if(id==='vehicles') main.innerHTML=await renderVehicles();
  else if(id==='materials') main.innerHTML=await renderMaterials();
  else if(id==='contractors') main.innerHTML=await renderContractors();
  else if(id==='incidents') main.innerHTML=await renderIncidents();
  else if(id==='reports') main.innerHTML=await renderReports();
}

/* ============================================================
   DASHBOARD
   ============================================================ */
async function renderDashboard(){
  // Fetch all tables securely
  const v=await DB.get('visitors');
  const e=await DB.get('employees');
  const veh=await DB.get('vehicles');
  const m=await DB.get('materials');
  const c=await DB.get('contractors');
  const inc=await DB.get('incidents');
  
  const t=today();
  const insideV=v.filter(x=>x.inTime && !x.outTime).length;
  const insideE=e.filter(x=>x.status==='In').length;
  const insideVeh=veh.filter(x=>x.status==='In').length;
  
  let pendingVisitors = v.filter(x=>x.status==='Pending');
  const pending = pendingVisitors.length;

  return `
  <h2>Security Dashboard - ${currentUser.role}</h2>
  <div class="stats">
    <div class="stat"><div class="num">${v.filter(x=>x.date===t).length}</div><div class="label">Visitors Today</div></div>
    <div class="stat success"><div class="num">${insideV}</div><div class="label">Visitors Inside</div></div>
    ${currentUser.role !== 'DeptHead' ? `
      <div class="stat"><div class="num">${insideE}</div><div class="label">Employees Inside</div></div>
      <div class="stat"><div class="num">${insideVeh}</div><div class="label">Vehicles Inside</div></div>
      <div class="stat"><div class="num">${m.filter(x=>x.date===t).length}</div><div class="label">Material Passes</div></div>
    ` : ''}
    <div class="stat warn"><div class="num">${pending}</div><div class="label">Pending Approvals</div></div>
    ${currentUser.role === 'Admin' ? `
      <div class="stat"><div class="num">${c.filter(x=>x.status==='Active').length}</div><div class="label">Active Contractors</div></div>
      <div class="stat danger"><div class="num">${inc.filter(x=>x.status==='Open').length}</div><div class="label">Open Incidents</div></div>
    ` : ''}
  </div>
  
  <div class="card">
    <h3>Pending Visitor Approvals</h3>
    ${pending ? `<table><tr><th>Pass</th><th>Name</th><th>Company</th><th>Host</th><th>Action</th></tr>
      ${pendingVisitors.map(x=>`<tr>
        <td>${x.passNo}</td><td>${x.name}</td><td>${x.company || '-'}</td><td>${x.host}</td>
        <td><button class="btn btn-success btn-sm" onclick="approveVisitor('${x.id}')">Approve</button>
        <button class="btn btn-danger btn-sm" onclick="rejectVisitor('${x.id}')">Reject</button></td>
      </tr>`).join('')}</table>` : '<div class="empty">No pending approvals ✅</div>'}
  </div>`;
}

async function approveVisitor(id){ 
  await DB.update('visitors',id,{status:'Approved'}); 
  navigate('dashboard'); 
}
async function rejectVisitor(id){ 
  await DB.update('visitors',id,{status:'Rejected'}); 
  navigate('dashboard'); 
}

/* ============================================================
   VISITORS
   ============================================================ */
let pendingPhoto='';

async function renderVisitors(){
  const v=await DB.get('visitors');
  
  const regForm = `
  <div class="card">
    <h3>New Visitor Registration</h3>
    <div class="form-grid">
      <div><label>Full Name *</label><input id="v_name"></div>
      <div><label>Company</label><input id="v_company"></div>
      <div><label>Phone</label><input id="v_phone"></div>
      <div><label>Host Department</label><select id="v_host">
        <option>HR</option><option>Purchase</option><option>Production</option><option>Admin</option><option>Stores</option>
      </select></div>
      <div class="full"><label>Purpose of Visit</label><input id="v_purpose"></div>
      <div class="full"><label>Visitor Photo / ID Proof</label><input type="file" id="v_photo" accept="image/*" onchange="capturePhoto(event)"></div>
    </div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="addVisitor()">Register & Generate Pass</button>
  </div>`;

  return `
  <h2>Visitor Management</h2>
  ${regForm}
  <div class="card">
    <h3>Visitor Register</h3>
    <table>
      <tr><th>Pass No</th><th>Name</th><th>Company</th><th>Host</th><th>In</th><th>Out</th><th>Status</th><th>Actions</th></tr>
      ${v.length?v.map(x=>`<tr>
        <td>${x.passNo}</td><td>${x.name}</td><td>${x.company||'-'}</td><td>${x.host}</td>
        <td>${x.inTime?x.inTime.split(',')[1]||x.inTime:'-'}</td>
        <td>${x.outTime?x.outTime.split(',')[1]||x.outTime:'-'}</td>
        <td><span class="badge badge-${x.status.toLowerCase()}">${x.status}</span></td>
        <td>
          ${x.status==='Approved'&&!x.inTime && currentUser.role !== 'DeptHead' ? `<button class="btn btn-primary btn-sm" onclick="checkInVisitor('${x.id}')">Check In & Print</button>`:''}
          ${x.inTime&&!x.outTime && currentUser.role !== 'DeptHead' ? `<button class="btn btn-danger btn-sm" onclick="checkOutVisitor('${x.id}')">Check Out</button>`:''}
          ${x.inTime ? `<button class="btn btn-warn btn-sm" onclick="printGatePass('${x.id}')">🖨️ Print</button>` : ''}
          ${currentUser.role !== 'DeptHead' ? `<button class="btn btn-sm" style="background:#64748b;color:#fff" onclick="showQR('${x.id}')">QR</button>` : ''}
        </td>
      </tr>`).join(''):'<tr><td colspan="8" class="empty">No visitors yet</td></tr>'}
    </table>
  </div>`;
}

function capturePhoto(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader(); r.onload=ev=>pendingPhoto=ev.target.result; r.readAsDataURL(f);
}

async function addVisitor(){
  const name=document.getElementById('v_name').value.trim();
  if(!name){alert('Name required');return;}
  
  // Generate Pass Number based on array length
  const currentVisitors = await DB.get('visitors');
  const count = currentVisitors.length + 1001;
  
  const pass={passNo:'VP-'+count,name,
    company:document.getElementById('v_company').value,
    phone:document.getElementById('v_phone').value,
    host:document.getElementById('v_host').value,
    purpose:document.getElementById('v_purpose').value,
    photo:pendingPhoto,status:'Pending',inTime:'',outTime:'',date:today()};
  
  pendingPhoto=''; 
  await DB.add('visitors',pass);
  
  alert('Visitor registered. Pass '+pass.passNo+' pending approval.');
  navigate('visitors');
}

async function checkInVisitor(id){ 
  await DB.update('visitors',id,{inTime:now()}); 
  navigate('visitors'); 
  printGatePass(id); 
}

async function checkOutVisitor(id){ 
  const confirmHandover = confirm("Has the visitor physically handed over the printed Gate Pass to Security?");
  if(!confirmHandover) {
    alert("Check-out cancelled. Security must collect the physical pass first.");
    return;
  }
  
  await DB.update('visitors',id,{outTime:now()}); 
  navigate('visitors'); 
  
  if(confirm("Gate Pass collected. Do you want to print a 'Final Exit' copy with checkout time?")) {
      printGatePass(id);
  }
}

async function showQR(id){
  const allVisitors = await DB.get('visitors');
  const v = allVisitors.find(x=>x.id==id);
  if(!v)return;
  document.getElementById('qrDetails').innerHTML=
    `<p><b>${v.name}</b></p><p>${v.company||''}</p><p>Pass: ${v.passNo}</p><p>Host: ${v.host}</p><p>Status: ${v.status}</p>`;
  const box=document.getElementById('qrcode'); box.innerHTML='';
  new QRCode(box,{text:`PASS:${v.passNo}|NAME:${v.name}|HOST:${v.host}`,width:180,height:180});
  document.getElementById('qrModal').classList.remove('hidden');
}
function closeQR(){ document.getElementById('qrModal').classList.add('hidden'); }

/* ============================================================
   PRINT GATE PASS LOGIC
   ============================================================ */
async function printGatePass(id) {
  const allVisitors = await DB.get('visitors');
  const v = allVisitors.find(x=>x.id==id);
  if(!v) return;

  const passType = v.outTime ? "EXIT COPY" : "ENTRY COPY";

  const printHtml = `
    <div class="pass-container">
      <div class="pass-header">
        <h1>GOLDSUN AUTO</h1>
        <p>VISITOR GATE PASS (${passType})</p>
      </div>
      
      <table class="pass-details">
        <tr><td>Pass Number:</td><td><b>${v.passNo}</b></td></tr>
        <tr><td>Visitor Name:</td><td>${v.name}</td></tr>
        <tr><td>Company:</td><td>${v.company || '-'}</td></tr>
        <tr><td>Phone:</td><td>${v.phone || '-'}</td></tr>
        <tr><td>Host Department:</td><td>${v.host}</td></tr>
        <tr><td>Purpose:</td><td>${v.purpose || '-'}</td></tr>
        <tr><td>Check-In Time:</td><td>${v.inTime || '-'}</td></tr>
        <tr><td>Check-Out Time:</td><td><b>${v.outTime || 'Pending...'}</b></td></tr>
        <tr><td>Date:</td><td>${v.date}</td></tr>
      </table>

      <div class="pass-signatures">
        <div class="signature-box">
          <div class="signature-line">Visitor Signature</div>
        </div>
        <div class="signature-box">
          <div class="signature-line">Department Incharge Signature</div>
        </div>
      </div>

      <div class="pass-footer">
        <p>Security Guard: _______________________</p>
        <p style="margin-top:10px;">This is a computer-generated gate pass. The visitor is required to obtain physical signatures before leaving the premises.</p>
      </div>
    </div>
  `;

  document.getElementById('printSection').innerHTML = printHtml;
  window.print();
}

/* ============================================================
   EMPLOYEES
   ============================================================ */
async function renderEmployees(){
  const e=await DB.get('employees');
  return `
  <h2>Employee Entry / Exit</h2>
  <div class="card">
    <h3>Mark Employee Entry</h3>
    <div class="form-grid">
      <div><label>Employee Code</label><input id="e_code" placeholder="GA-201"></div>
      <div><label>Name</label><input id="e_name"></div>
      <div><label>Department</label><select id="e_dept">
        <option>Production</option><option>HR</option><option>Purchase</option><option>Stores</option><option>Admin</option><option>IT</option></select></div>
      <div><label>Late Entry?</label><select id="e_late"><option value="false">No</option><option value="true">Yes</option></select></div>
    </div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="addEmployee()">Mark In</button>
  </div>
  <div class="card">

      <div><label>PO Number</label><input id="m_po"></div>
      <div><label>Quantity / Description</label><input id="m_qty"></div>
      <div><label>Returnable?</label><select id="m_return"><option value="false">No</option><option value="true">Yes</option></select></div>
      <div><label>Expected Return Date</label><input type="date" id="m_returnDate"></div>
    </div>

   ============================================================ */
async function renderReports(){
  return `
  <h2>Reports & Export</h2>
  <div class="card">
    <h3>Filter</h3>
    <div class="filter-bar">
      <label style="font-size:13px">From <input type="date" id="r_from" value="${today()}"></label>
      <label style="font-size:13px">To <input type="date" id="r_to" value="${today()}"></label>
      <select id="r_module">
        <option value="visitors">Visitors</option>
        ${currentUser.role === 'Admin' ? `<option value="employees">Employees</option>
        <option value="vehicles">Vehicles</option>
        <option value="materials">Materials</option>
        <option value="incidents">Incidents</option>` : ''}
      </select>
      <button class="btn btn-primary" onclick="runReport()">Generate</button>
      <button class="btn btn-success" onclick="exportCSV()">⬇ Export Excel (CSV)</button>
    </div>
    <div id="reportOut"></div>
  </div>`;
}
let lastReport=[];
async function runReport(){
  const mod=document.getElementById('r_module').value;
  const from=document.getElementById('r_from').value, to=document.getElementById('r_to').value;
  let data=await DB.get(mod);
  
  data = data.filter(x=>{
    const d=x.date||'';
    return (!from||d>=from)&&(!to||d<=to);
  });
  
  lastReport=data; lastReport._module=mod;
  const out=document.getElementById('reportOut');
  if(!data.length){out.innerHTML='<div class="empty">No records in this range</div>';return;}
  const keys=Object.keys(data[0]).filter(k=>k!=='id'&&k!=='photo');
  out.innerHTML=`<table><tr>${keys.map(k=>`<th>${k}</th>`).join('')}</tr>
    ${data.map(r=>`<tr>${keys.map(k=>`<td>${r[k]||'-'}</td>`).join('')}</tr>`).join('')}</table>`;
}
function exportCSV(){
  if(!lastReport.length){alert('Generate a report first');return;}
  const keys=Object.keys(lastReport[0]).filter(k=>k!=='id'&&k!=='photo');
  let csv=keys.join(',')+'\n';
  lastReport.forEach(r=>{ csv+=keys.map(k=>`"${(r[k]||'').toString().replace(/"/g,'""')}"`).join(',')+'\n'; });
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`goldsun_${lastReport._module||'report'}_${today()}.csv`;
  a.click();
}
</script>
